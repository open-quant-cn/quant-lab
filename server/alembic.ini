# Developer entry for `uv run alembic ...` (e.g. revision --autogenerate).
# serve upgrades app.db itself via app.schema.migrate; the database path comes
# from QUANT_LAB_DATA_ROOT, see app/schema/env.py.
[alembic]
script_location = %(here)s/app/schema
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
